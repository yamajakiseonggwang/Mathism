<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathism — Mathematical Problem Archive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- MathJax for LaTeX Rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['[', ']']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navigation -->
    <header class="w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center border-b border-slate-800/60">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="showSection('home')">
            <span class="text-2xl font-black tracking-tighter text-indigo-400">MATH<span class="text-white">ISM</span></span>
            <span class="text-xs px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-semibold border border-indigo-500/30">v1.6</span>
        </div>
        <nav class="hidden md:flex space-x-8 text-sm font-semibold text-slate-400">
            <a href="#" onclick="showSection('problems')" class="hover:text-indigo-400 transition">문제 은행</a>
            <a href="#rankings" class="hover:text-indigo-400 transition">영역별 랭커</a>
            <a href="#tiers" class="hover:text-indigo-400 transition">티어 시스템</a>
        </nav>
        <div id="authContainer" class="flex items-center space-x-3">
            <button onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2 rounded-lg shadow-lg shadow-indigo-500/20 transition">
                로그인 / 시작하기
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl mx-auto px-6 py-12 flex-grow flex flex-col justify-center">
        
        <!-- 1. Home View -->
        <div id="homeView" class="w-full text-center flex flex-col items-center py-12">
            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-indigo-400 font-medium mb-8">
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                <span>엄밀한 수학적 사고와 논리를 검증하는 아카이브</span>
            </div>

            <!-- 홍보 문구 (LaTeX 언급 제거) -->
            <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6 leading-tight">
                Interactive Mathematical<br>
                <span class="bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent">
                    Problem Archive
                </span>
            </h1>

            <p class="text-base md:text-lg text-slate-400 max-w-2xl mb-1
